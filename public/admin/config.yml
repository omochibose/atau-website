# Decap CMS — https://decapcms.org/  管理画面: /admin/
#
# バックエンド: git-gateway（Netlify Identity + Git Gateway）
# → 編集者はメール招待で Netlify Identity に登録するだけ（GitHub アカウント不要）。
# → コミットは Netlify が GitHub リポジトリに代行する。
#
# Netlify での必須設定（サイトにこの GitHub リポジトリが紐づいている前提）:
#   1) Site configuration → Identity → Enable Identity
#   2) Registration: 運用に合わせる（本番は「Invite only」推奨）
#   3) Identity → Services → Git Gateway → Enable Git Gateway
#   4) Identity → Invite users で編集者に招待メールを送る（受信者がパスワードを設定）
#
# カスタムドメインを Cloudflare のプロキシ（オレンジ雲）経由にしている場合、
# /.netlify/identity へのリクエストが遮られることがある。その場合は DNS のみにするか、
# Netlify サブドメインで /admin を開く等の対応が必要な場合があります。
#
# ローカル編集: backend の直後に `local_backend: true` を一時追加し、
#   `npm run cms:local` を起動。本番用の変更はコミット前に local_backend を削除すること。

backend:
  name: git-gateway
  branch: main

site_url: https://atau-dd.com
display_url: https://atau-dd.com
logo_url: https://atau-dd.com/favicon.svg
publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

locale: ja

collections:
  - name: blog
    label: ブログ
    label_singular: 記事
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: タイトル, name: title, widget: string }
      - { label: 説明（一覧・OG 用）, name: description, widget: text }
      - label: 公開日
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
      - label: タグ
        name: tags
        widget: list
        required: false
        default: []
      - { label: 下書き, name: draft, widget: boolean, default: false }
      - { label: 本文, name: body, widget: markdown }
