# Decap CMS — https://decapcms.org/  管理画面: /admin/
#
# バックエンド: github（GitHub OAuth 直接連携。編集者は自分のみを想定）
# → ログイン時、Netlify がホストする OAuth プロバイダ経由で GitHub 認可を行い、
#   Decap CMS がそのままリポジトリへ直接コミットする（Netlify Identity / Git Gateway は不使用）。
#
# 必須設定（このリポジトリ omochibose/atau-website への push 権限を持つ GitHub アカウントで運用する前提）:
#   1) GitHub → Settings → Developer settings → OAuth Apps → New OAuth App を作成
#        Homepage URL: https://atau-dd.com
#        Authorization callback URL: https://api.netlify.com/auth/done
#      発行された Client ID / Client Secret を控える。
#   2) Netlify → Site configuration → Access control → OAuth clients → Install provider
#        Provider: GitHub / 上記の Client ID・Secret を登録
#   3) ブラウザで https://atau-dd.com/admin/ を開き「Login with GitHub」でログイン
#      （ログインできるのは、このリポジトリへの書き込み権限を持つ GitHub アカウントのみ）
#
# ローカル編集: backend の直後に `local_backend: true` を一時追加し、
#   `npm run cms:local` を起動。本番用の変更はコミット前に local_backend を削除すること。

backend:
  name: github
  repo: omochibose/atau-website
  branch: main

site_url: https://atau-dd.com
display_url: https://atau-dd.com
logo_url: https://atau-dd.com/favicon.svg
publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

locale: ja

collections:
  - name: blog
    label: ブログ
    label_singular: 記事
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    # 「ライブで見る」等: site_url と組み合わせて iframe の URL に使う（未設定だと / だけになる）
    preview_path: blog/{{slug}}
    fields:
      - { label: タイトル, name: title, widget: string }
      - { label: 説明（一覧・OG 用）, name: description, widget: text }
      - label: 公開日
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
      - label: タグ
        name: tags
        widget: list
        required: false
        default: []
      - { label: 下書き, name: draft, widget: boolean, default: false }
      - { label: 本文, name: body, widget: markdown }
